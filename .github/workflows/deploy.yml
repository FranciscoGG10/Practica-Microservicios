name: Deploy to Azure ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
    - name: Bajar código
      uses: actions/checkout@v4

    - name: Login en Azure
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 1. AUTH
    - name: Build Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth_service
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:latest

    # 2. GAME
    - name: Build Game Service
      uses: docker/build-push-action@v5
      with:
        context: ./game_service
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/game-service:latest

    # 3. SCORE
    - name: Build Score Service
      uses: docker/build-push-action@v5
      with:
        context: ./score_service
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/score-service:latest

    # 4. FRONTEND
    - name: Build Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest
