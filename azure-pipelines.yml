trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'your-docker-registry-service-connection'
  imageRepository: 'your-image-repository-name'
  containerRegistry: 'your-container-registry-name'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build Docker Images'
  jobs:
  - job: Build
    displayName: 'Build and Push Docker Images'
    steps:
    - task: Docker@2
      displayName: 'Build and push auth_service'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)/auth_service'
        dockerfile: 'auth_service/Dockerfile'
        tags: |
          $(tag)

    - task: Docker@2
      displayName: 'Build and push game_service'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)/game_service'
        dockerfile: 'game_service/Dockerfile'
        tags: |
          $(tag)

    - task: Docker@2
      displayName: 'Build and push score_service'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)/score_service'
        dockerfile: 'score_service/Dockerfile'
        tags: |
          $(tag)

    - task: Docker@2
      displayName: 'Build and push frontend'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)/frontend'
        dockerfile: 'frontend/Dockerfile'
        tags: |
          $(tag)

- stage: Deploy
  displayName: 'Deploy to Azure'
  jobs:
  - job: Deploy
    displayName: 'Deploy to Azure Web App'
    steps:
    - task: AzureWebApp@1
      displayName: 'Deploy auth_service'
      inputs:
        azureSubscription: 'your-azure-subscription'
        appName: 'your-auth-service-app-name'
        package: '$(Pipeline.Workspace)/auth_service:$(tag)'

    - task: AzureWebApp@1
      displayName: 'Deploy game_service'
      inputs:
        azureSubscription: 'your-azure-subscription'
        appName: 'your-game-service-app-name'
        package: '$(Pipeline.Workspace)/game_service:$(tag)'

    - task: AzureWebApp@1
      displayName: 'Deploy score_service'
      inputs:
        azureSubscription: 'your-azure-subscription'
        appName: 'your-score-service-app-name'
        package: '$(Pipeline.Workspace)/score_service:$(tag)'

    - task: AzureWebApp@1
      displayName: 'Deploy frontend'
      inputs:
        azureSubscription: 'your-azure-subscription'
        appName: 'your-frontend-app-name'
        package: '$(Pipeline.Workspace)/frontend:$(tag)'