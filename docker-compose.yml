version: '3.8'

services:
  auth_service:
    build: ./auth_service
    ports:
      - "8001:8001"
    environment:
      - ENV=production

  game_service:
    build: ./game_service
    ports:
      - "8002:8002"
    environment:
      - ENV=production

  score_service:
    build: ./score_service
    ports:
      - "8003:8003"
    environment:
      - ENV=production

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      - ENV=production

networks:
  default:
    driver: bridge