version: '3.8'
services:
  auth_service:
    build: ./auth_service
    ports:
      - "8001:8001"

  game_service:
    build: ./game_service
    ports:
      - "8002:8002"

  score_service:
    build: ./score_service
    ports:
      - "8003:8003"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      # Localmente, estas variables son opcionales porque el script 
      # env.sh tiene valores por defecto a localhost, pero aquí las dejo explícitas:
      - AUTH_URL=http://localhost:8001
      - GAME_URL=http://localhost:8002
      - SCORE_URL=http://localhost:8003